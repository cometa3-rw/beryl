<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#071411">
  <meta name="description" content="『転生先は観測圏外』の読者向け観測アーカイブ。BERYLの観測端末から、本編で出会った未知をたどる。">
  <title>観測アーカイブ | BERYL</title>
  <link rel="stylesheet" href="./style.css">
  <script src="./main.js" defer></script>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="./"><span class="mark" aria-hidden="true"></span>VERIDIAN</a>
    <nav aria-label="メインナビゲーション">
      <a href="#system">BERYLについて</a>
      <a href="#terminal">観測端末</a>
    </nav>
  </header>
  <main>
    <section class="hero" aria-labelledby="title">
      <div class="hero-art" aria-hidden="true">
        <div class="orbit"></div>
        <canvas id="crystal"></canvas>
      </div>
      <div class="hero-copy">
        <p class="eyebrow">BERYL / OBSERVATION TERMINAL</p>
        <h1 id="title">観測アーカイブ</h1>
        <p class="tagline">本編で出会った未知を、<br>ルヴィーの観測記録からたどる。</p>
        <details id="terminal">
          <summary>観測端末を起動</summary>
          <div class="console">
            <p class="eyebrow">BERYL / ARCHIVE</p>
            <p>観測図鑑は準備中です。</p>
          </div>
        </details>
      </div>
    </section>
    <section class="section" id="system" aria-labelledby="system-title">
      <p class="eyebrow">THE SYSTEM</p>
      <div>
        <h2 id="system-title">緑柱石の名を持つOS。</h2>
        <p>BERYL（ベリル）は、星間企業ヴェリディアンの汎用OSです。緑柱石からエメラルドやアクアマリンが生まれるように、ひとつの共通基盤が多様な機器と業務を支えます。</p>
      </div>
    </section>
  </main>
  <footer><span class="brand"><span class="mark" aria-hidden="true"></span>VERIDIAN</span><a href="https://kakuyomu.jp/works/11054822664931823071">本編『転生先は観測圏外』</a></footer>
</body>
</html>
